{% extends "base.html" %}

{% block content %}
<section class="page-heading">
    <div>
        <h2>Edit Transaction</h2>
        <p>
            Update the details of your transaction.
        </p>
    </div>
</section>

<section class="page-section">
    <form
        class="transaction-form"
        method="POST"
        action="{{ url_for('edit_transaction', transaction_id=transaction['transaction_id']) }}"
    >
        <div class="form-grid">
            <div class="form-group">
                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    step="0.01"
                    value="{{ transaction['amount'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="type">Type</label>

                <select
                    id="type"
                    name="type"
                    required
                >
                    <option
                        value="expense"
                        {% if transaction['type'] == 'expense' %}
                            selected
                        {% endif %}
                    >
                        Expense
                    </option>

                    <option
                        value="income"
                        {% if transaction['type'] == 'income' %}
                            selected
                        {% endif %}
                    >
                        Income
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="category_id">
                    Category
                </label>

                <select
                    id="category_id"
                    name="category_id"
                    required
                >
                    {% for category in categories %}
                        <option
                            value="{{ category['category_id'] }}"
                            {% if transaction['category_id'] == category['category_id'] %}
                                selected
                            {% endif %}
                        >
                            {{ category['name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="transaction_date">
                    Date
                </label>

                <input
                    type="date"
                    id="transaction_date"
                    name="transaction_date"
                    value="{{ transaction['transaction_date'] }}"
                    required
                >
            </div>

            <div class="form-group form-group-full">
                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    value="{{ transaction['description'] or '' }}"
                    placeholder="Optional description"
                >
            </div>
        </div>

        <div class="form-actions">
            <button type="submit">
                Save Changes
            </button>

            <a
                href="{{ url_for('transactions') }}"
                class="secondary-button"
            >
                Cancel
            </a>
        </div>
    </form>
</section>
{% endblock %}
